<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1a1d">
<meta name="mobile-web-app-capable" content="yes">
<title>Cargo Rookie IAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23ffd23f%22/%3E%3Crect x=%223%22 y=%224%22 width=%2210%22 height=%228%22 fill=%22%23c98a4b%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c" aria-label="Gudang kargo IAS 3D"></canvas>

<div id="hud" hidden>
  <div class="hrow"><div class="badges" id="badges"></div><b id="pts">0</b></div>
  <div class="obj"><span id="obj"></span><small id="cardsCount"></small></div>
</div>
<div id="joy" hidden><div id="knob"></div></div>
<button id="aBtn" hidden aria-label="Aksi">SPACE</button>
<div id="prompt" hidden></div>
<div id="toast" role="status"></div>
<div id="infoCard" hidden><small>KARTU INFO DITEMUKAN</small><b id="icT"></b><p id="icD"></p></div>

<div id="dlg" class="sheet" hidden><div class="dbox"><div class="who" id="dWho"></div><p id="dTxt" aria-live="polite"></p><span class="more">▼</span></div></div>

<div id="duel" class="sheet tall" hidden>
  <div class="foe"><div><b id="foeName"></b><span id="foeRole"></span></div><div class="hp"><i id="foeHp"></i></div></div>
  <div class="panel">
    <small id="duelNo"></small>
    <p id="duelQ" class="q"></p>
    <div class="tbar" id="tbar"><i id="tfill"></i></div>
    <div class="moves" id="moves"></div>
    <div class="fb" id="duelFb" hidden></div>
    <button class="btn" id="duelNext" hidden>Lanjut ▶</button>
  </div>
</div>

<div id="sort" class="sheet tall" hidden>
  <div class="panel">
    <small id="sortNo"></small>
    <div class="lbl" id="sortLbl"></div>
    <div class="tbar"><i id="sfill"></i></div>
    <div class="bins" id="bins"></div>
    <div class="fb" id="sortFb" hidden></div>
    <button class="btn" id="sortNext" hidden>Lanjut ▶</button>
  </div>
</div>

<section id="title" class="scr on">
  <div class="box">
    <h1>Cargo Rookie</h1>
    <p class="sub">Petualangan shift pertama di Gudang IAS</p>
    <p>Jelajahi gudang, temui para kru dan Direksi, kumpulkan kartu info, dan menangkan 4 lencana.</p>
    <button class="btn" id="bStart" disabled>Memuat gudang…</button>
    <p class="mute">Gerak: joystick / WASD / panah<br>Aksi / Bicara: tombol SPACE / E</p>
  </div>
</section>

<section id="form" class="scr">
  <div class="box">
    <h2>Kartu identitas</h2>
    <form id="fReg" novalidate>
      <label>Kode event (dari fasilitator)<input id="fEvent" autocomplete="off" autocapitalize="characters" maxlength="24" placeholder="Contoh: ONB-NOV26"></label>
      <label>Nama lengkap<input id="fNama" autocomplete="name" maxlength="60"></label>
      <label>NIP (opsional)<input id="fNip" inputmode="numeric" maxlength="20"></label>
      <label>Unit kerja / divisi<input id="fUnit" maxlength="60"></label>
      <label>Lokasi penempatan
        <select id="fLok"><option value="">Pilih lokasi</option><option>Kantor Pusat (Jakarta)</option><option>Region 1 – Jakarta (CGK)</option><option>Region 2 – Bali (DPS)</option><option>Region 3 – Medan (KNO)</option><option>Region 4 – Makassar (UPG)</option><option>Lainnya</option></select></label>
      <label>Ceritakan singkat tentang dirimu (opsional)<textarea id="fAbout" maxlength="160" placeholder="Contoh: Baru bergabung dari dunia logistik, suka naik gunung."></textarea></label>
      <p class="err" id="fErr" role="alert"></p>
      <button class="btn" type="submit">Ambil rompi &amp; masuk gudang</button>
      <button class="btn alt" type="button" id="fBack">Kembali</button>
    </form>
  </div>
</section>

<section id="result" class="scr">
  <div class="box">
    <div class="cert" id="cert"></div>
    <div class="stats" id="stats"></div>
    <p class="mute" id="saveMsg"></p>
    <h2>Papan skor event</h2>
    <div id="board"></div>
    <button class="btn" id="bAgain">Main lagi</button>
  </div>
</section>

<script type="module" src="game.js"></script>
</body>
</html>
